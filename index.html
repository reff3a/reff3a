<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="تطبيق وموقع رفعة للقرآن الكريم">
  <meta name="theme-color" content="#0A1128">

  <!-- ربط الـ Manifest والآيقونات -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>رِفْعَة | القرآن الكريم</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      background-color: #0A1128;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #app-splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #162A4A 0%, #0A1128 100%);
      z-index: 999999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 1;
    }

    #app-splash-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .splash-card {
      text-align: center;
      padding: 30px;
      width: 88%;
      max-width: 360px;
    }

    .brand-logo-wrap {
      position: relative;
      width: 76px;
      height: 76px;
      margin: 0 auto 20px auto;
    }

    .gold-ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 3px solid rgba(230, 194, 128, 0.15);
      border-top: 3px solid #E6C280;
      border-radius: 50%;
      animation: spin 0.9s infinite linear;
      box-shadow: 0 0 15px rgba(230, 194, 128, 0.2);
    }

    .brand-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 26px;
      color: #E6C280;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .app-title {
      font-size: 32px;
      font-weight: 800;
      color: #E6C280;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }

    .app-subtitle {
      font-size: 13px;
      color: rgba(230, 194, 128, 0.75);
      margin-bottom: 24px;
    }

    .progress-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(230, 194, 128, 0.2);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #C5A059 0%, #E6C280 100%);
      border-radius: 10px;
      transition: width 0.2s ease-out;
    }

    .percentage-indicator {
      margin-top: 8px;
      font-size: 12px;
      color: rgba(230, 194, 128, 0.6);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div id="app-splash-screen">
    <div class="splash-card">
      <div class="brand-logo-wrap">
        <div class="gold-ring"></div>
        <div class="brand-icon">📖</div>
      </div>
      <div class="app-title">رِفْعَة</div>
      <div id="status-label" class="app-subtitle">جاري تحميل المصحف الشريف...</div>
      
      <div class="progress-container">
        <div id="progress-fill" class="progress-bar"></div>
      </div>
      <div id="percent-label" class="percentage-indicator">0%</div>
    </div>
  </div>

  <script>
    (function() {
      var splash = document.getElementById('app-splash-screen');
      var fill = document.getElementById('progress-fill');
      var percentText = document.getElementById('percent-label');
      var statusText = document.getElementById('status-label');

      var progress = 0;
      var isDismissed = false;

      function updateProgress(val, msg) {
        if (isDismissed) return;
        progress = Math.min(val, 100);
        if (fill) fill.style.width = progress + '%';
        if (percentText) percentText.innerText = Math.floor(progress) + '%';
        if (msg && statusText) statusText.innerText = msg;
      }

      var timer = setInterval(function() {
        if (progress < 50) {
          updateProgress(progress + 5, "تحضير السور والقراء...");
        } else if (progress < 90) {
          updateProgress(progress + 2, "تجهيز الواجهة...");
        }
      }, 80);

      function hideSplash() {
        if (isDismissed) return;
        isDismissed = true;
        clearInterval(timer);
        updateProgress(100, "جاهز");

        setTimeout(function() {
          if (splash) {
            splash.classList.add('fade-out');
            setTimeout(function() { splash.remove(); }, 500);
          }
        }, 100);
      }

      window.addEventListener('flutter-first-frame', hideSplash);
      setTimeout(hideSplash, 5000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
